[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pca3d"
version = "1.0.0"
description = "Probabilistic cellular automata as fermionic QFT, from 1+1D to 3+1D"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x"]
dev = ["pytest>=7", "sympy>=1.12", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
